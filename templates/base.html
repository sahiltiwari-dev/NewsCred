<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}EvidenceCompass: check a news claim before you share it{% endblock %}</title>
  <meta name="description" content="Paste a headline, forwarded message or article link and see how well it holds up against recent coverage, fact-checks and original sources.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233d2fe0'/%3E%3Cpath d='M8 21a8 8 0 0 1 16 0' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 21l4-7' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ url_for('home') }}" aria-label="EvidenceCompass home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="currentColor"/>
          <path d="M8 21a8 8 0 0 1 16 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <path d="M16 21l4-7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span>EvidenceCompass</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="{{ url_for('home') }}#how">How it works</a>
        <a href="{{ url_for('about') }}">About</a>
        {% block nav_extra %}{% endblock %}
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch between light and dark mode" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3L7 7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <p>EvidenceCompass scores how well a claim is backed by public sources. It cannot prove a claim true or false, so read the sources before you share.</p>
      <nav aria-label="Footer">
        <a href="{{ url_for('about') }}">About</a>
        <a href="{{ url_for('privacy') }}">Privacy</a>
      </nav>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
